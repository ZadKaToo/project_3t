services:
  db:
    image: mysql:8.0
    container_name: mysql_rpg_container
    command: --default-authentication-plugin=mysql_native_password 
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: project_db
      MYSQL_ROOT_HOST: '%'            
    ports:
      - "3308:3306"

  app:
    build: .
    container_name: dnd-quiz-v2
    restart: always                 # 👈 เพิ่มบรรทัดนี้ เพื่อให้ Node.js รีสตาร์ทตัวเองถ้าเชื่อม DB ไม่ติด
    ports:
      - "8081:80"
    depends_on:
      - db